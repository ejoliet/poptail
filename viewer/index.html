<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>poptail</title>
<style>
:root{color-scheme:dark}
body{background:#111;color:#0f0;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;margin:0}
#bar{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:6px 8px;
     background:#000;border-bottom:1px solid #333;color:#888}
#bar input{flex:1;min-width:60px;background:#111;color:#0f0;border:1px solid #333;
           padding:3px 6px;font:inherit}
#bar button{background:#222;color:#ccc;border:1px solid #444;padding:3px 8px;font:inherit;cursor:pointer}
#bar button[aria-pressed=true]{background:#0f0;color:#000}
#stat{white-space:nowrap;font-variant-numeric:tabular-nums}
pre{margin:0;padding:8px;white-space:pre-wrap;word-break:break-all}
</style>

<div id="bar">
  <button id="pause" type="button" aria-pressed="false">pause</button>
  <input id="q" type="search" placeholder="filter…" autocomplete="off" spellcheck="false"
         aria-label="filter lines">
  <span id="stat" role="status">connecting…</span>
</div>
<pre id="log" aria-live="off"></pre>

<script>
// poptail viewer — decrypts the SSE stream with the key from the URL fragment.
// The fragment never leaves the browser, so the tunnel edge only ever sees
// ciphertext.
const logEl = document.getElementById('log');
const statEl = document.getElementById('stat');
const qEl = document.getElementById('q');
const pauseEl = document.getElementById('pause');
const td = new TextDecoder(), te = new TextEncoder();

// AIDEV-NOTE: 5,000-line DOM cap (README Open Question 3) — confirmed smooth on
// mobile Safari during the spike 3 firehose gate (1,000 lines/s).
const maxLines = 5000;

let lines = [];      // retained plaintext, <= maxLines — backs filter + resume redraw
let pend = [];       // decrypted but not yet rendered
let domLines = 0;
let paused = false, filter = '', needRedraw = false;
let total = 0, win = 0, rate = 0, lastId = 0, gaps = 0, fails = 0;
let state = 'connecting…';

function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
function b64url(s) { return b64(s.replace(/-/g, '+').replace(/_/g, '/')); }

// AIDEV-NOTE: crypto.subtle exists only in secure contexts (https or
// localhost). A plain http://<lan-ip> URL has no WebCrypto at all — say so
// instead of dying silently (this bit a real -local session on 2026-08-11).
if (!crypto.subtle) {
  statEl.textContent = 'WebCrypto unavailable — open this link via https or on localhost';
  throw new Error('no WebCrypto');
}
if (!location.hash.startsWith('#k=')) {
  statEl.textContent = 'missing #k= key in URL';
  throw new Error('no key');
}
// AIDEV-NOTE: the key stays in the fragment on purpose — a reload must still
// work, and the link IS the capability. Stripping it would break refresh.
let chain = crypto.subtle.importKey(
  'raw', b64url(location.hash.slice(3)), 'AES-GCM', false, ['decrypt']);

const es = new EventSource('/stream');
es.onopen = () => { state = 'live'; };
es.onerror = () => { state = 'reconnecting…'; }; // EventSource auto-retries with Last-Event-ID

// AIDEV-NOTE: decrypts are chained on one promise so lines stay in seq order
// even though WebCrypto resolves async. AAD must match the server: ASCII
// decimal seq — that is what makes reorder/replay tampering fail here.
es.onmessage = e => {
  chain = chain.then(async key => {
    const b = b64(e.data), id = +e.lastEventId;
    if (lastId && id > lastId + 1) gaps += id - lastId - 1; // ring jump: fell past the buffer
    lastId = id;
    try {
      const pt = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b.slice(0, 12), additionalData: te.encode(e.lastEventId) },
        key, b.slice(12));
      push(td.decode(pt));
      total++; win++;
    } catch (err) {
      fails++;
    }
    return key;
  });
};

function push(line) {
  lines.push(line);
  if (lines.length > maxLines) lines.splice(0, lines.length - maxLines);
  // While paused the display is frozen; resume redraws from `lines`, so there
  // is no unbounded pending queue to grow.
  if (!paused) pend.push(line);
}

function matches(l) { return !filter || l.toLowerCase().includes(filter); }
function atBottom() {
  return window.innerHeight + window.scrollY >= document.body.scrollHeight - 40;
}
function render(arr) { return arr.length ? arr.join('\n') + '\n' : ''; }

function redraw() {
  const shown = lines.filter(matches);
  logEl.textContent = render(shown);
  domLines = shown.length;
  if (atBottom()) window.scrollTo(0, document.body.scrollHeight);
}

// AIDEV-NOTE: one rAF-batched append per frame (single text node). Per-event
// DOM writes stall at 1,000 lines/s — this is the spike 3 fix.
function tick() {
  requestAnimationFrame(tick);
  if (needRedraw) { needRedraw = false; pend = []; redraw(); return; }
  if (paused || !pend.length) return;
  const add = pend.filter(matches);
  pend = [];
  if (!add.length) return;
  const stick = atBottom();
  logEl.appendChild(document.createTextNode(render(add)));
  domLines += add.length;
  if (domLines > maxLines) { redraw(); return; }
  if (stick) window.scrollTo(0, document.body.scrollHeight);
}
requestAnimationFrame(tick);

qEl.addEventListener('input', () => { filter = qEl.value.toLowerCase(); needRedraw = true; });
pauseEl.addEventListener('click', () => {
  paused = !paused;
  pauseEl.setAttribute('aria-pressed', String(paused));
  pauseEl.textContent = paused ? 'resume' : 'pause';
  if (!paused) needRedraw = true; // jump to the live tail
});

setInterval(() => {
  rate = win; win = 0;
  statEl.textContent = (paused ? 'paused' : state) +
    ' | ' + total + ' rx | ' + rate + '/s | gaps ' + gaps + ' | fails ' + fails;
}, 1000);
</script>
